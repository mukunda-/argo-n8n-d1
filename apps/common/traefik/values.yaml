ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`n8n-traefik.bitovi-ai.com`)
    entryPoints:
      - web
service:
  enabled: true
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
providers:
  kubernetesGateway:
    enabled: true
gateway:
  listeners:
    web:
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All
