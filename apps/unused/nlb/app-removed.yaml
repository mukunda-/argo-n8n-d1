apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-nlb
  namespace: argocd
  labels:
    managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/mukunda-/argo-n8n-d1
    targetRevision: HEAD
    path: apps/aws/nlb/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: aws-nlb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
