apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant
  namespace: argocd
  labels:
    managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
  - repoURL: https://qdrant.github.io/qdrant-helm
    chart: qdrant
    targetRevision: 1.16.3
    helm:
      releaseName: qdrant
      valueFiles:
        - $home/apps/common/qdrant/values.yaml
  - repoURL: https://github.com/mukunda-/argo-n8n-d1
    ref: home
  
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true