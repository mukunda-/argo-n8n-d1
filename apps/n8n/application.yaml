apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
  labels:
    managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://8gears.container-registry.com/library
    chart: n8n
    targetRevision: 1.0.4
    helm:
      releaseName: n8n
      valueFiles:
        - values.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
