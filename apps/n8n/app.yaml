apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
  labels:
    managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
  - repoURL: 8gears.container-registry.com/library
    chart: n8n
    targetRevision: 2.0.1
    helm:
      releaseName: n8n
      valueFiles:
        - $home/apps/n8n/values.yaml
  - repoURL: https://github.com/mukunda-/argo-n8n-d1
    ref: home
    
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
