architecture: replication
auth:
  enabled: false
sentinel:
  enabled: true
  masterSet: "mymaster"
  image:
    repository: bitnamilegacy/redis-sentinel
    tag: 7.2.4-debian-12-r9
master:
  persistence:
    enabled: true
    size: 2Gi
replica:
  replicaCount: 2
  persistence:
    enabled: true
    size: 2Gi
image:
  repository: bitnamilegacy/redis
  tag: 7.2.4-debian-12-r9
global:
  security:
    allowInsecureImages: true
    # TODO: We should look for a supported redis alternative.