apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  labels:
    managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
  - repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 20.5.0
    helm:
      releaseName: redis
      valueFiles:
        - $home/apps/common/redis/values.yaml
  - repoURL: https://github.com/mukunda-/argo-n8n-d1
    ref: home
  
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true