apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-ingress
  namespace: argocd
  labels:
    managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mukunda-/argo-n8n-d1
    targetRevision: HEAD
    path: apps/aws/ingress/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: aws-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
