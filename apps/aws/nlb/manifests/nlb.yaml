apiVersion: v1
kind: Service
metadata:
  name: aws-nlb
  annotations:
    # Specify the load balancer scheme as internet-facing (public) or internal
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Optional: Enable health check
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  selector:
    app: traefik
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  - name: https
    protocol: TCP
    port: 443
    targetPort: 443
  type: LoadBalancer
  # For clusters with Auto Mode enabled, this field can be omitted as it's the default controller
  loadBalancerClass: eks.amazonaws.com/nlb
