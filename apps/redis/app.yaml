apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  labels:
    managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
  - repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 20.5.0
    helm:
      releaseName: redis
      values: |
        architecture: standalone
        auth:
          enabled: true
          existingSecret: redis-password
          existingSecretPasswordKey: password
        master:
          persistence:
            enabled: true
            size: 4Gi
        image:
          registry: docker.io
          repository: bitnamilegacy/redis
          tag: 7.2.4-debian-12-r9
  - repoURL: https://github.com/mukunda-/argo-n8n-d1
    ref: home
  
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true